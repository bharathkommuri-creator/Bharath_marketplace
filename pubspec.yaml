name: resale_marketplace
description: "A cross-platform booking resale marketplace connecting Service Providers, Original Buyers (Sellers), and New Buyers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6
  flutter_dotenv: ^5.1.0   # secure secret management
  uuid: ^4.4.0             # cryptographically safe IDs
  image_picker: ^1.1.2     # camera / gallery image uploads
  sentry_flutter: ^8.9.0   # production crash & performance monitoring

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  app_links: 6.3.3





flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env                 # V-01: load environment file as asset
