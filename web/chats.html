<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chats – ResaleHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F9D58; --dark-forest: #064E3B;
      --bg-mint: #F0FDF4; --text-dark: #0F172A;
      --text-muted: #64748B; --border-light: #E2E8F0;
      --badge-red: #DC2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #F8FAFC; color: var(--text-dark); min-height: 100vh; }

    /* ── Navbar ── */
    .navbar {
      background: white; border-bottom: 1px solid var(--border-light);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(15,157,88,0.07);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-icon { font-size: 22px; background: var(--dark-forest); color: white; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .brand-title { font-size: 18px; font-weight: 800; color: var(--dark-forest); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: none; text-decoration: none; display: flex; align-items: center; gap: 6px;
    }
    .nav-btn-outline { background: var(--bg-mint); color: var(--dark-forest); }
    .nav-btn-primary { background: var(--primary); color: white; }

    /* ── Page ── */
    .page { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .page-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 28px; }

    /* ── Role tabs ── */
    .role-tabs {
      display: flex; gap: 8px; margin-bottom: 24px;
      background: white; padding: 6px; border-radius: 16px;
      border: 1px solid var(--border-light);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .role-tab {
      flex: 1; padding: 12px 8px; border-radius: 12px; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: transparent; color: var(--text-muted);
      transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .role-tab.active { color: white; }
    .role-tab[data-role="buyer"].active    { background: #3b82f6; }
    .role-tab[data-role="seller"].active   { background: var(--primary); }
    .role-tab[data-role="provider"].active { background: var(--dark-forest); }
    .role-tab .count-badge {
      background: rgba(0,0,0,0.1); border-radius: 20px;
      padding: 2px 8px; font-size: 11px;
    }
    .role-tab.active .count-badge { background: rgba(255,255,255,0.25); }

    /* ── Chat list ── */
    .chat-list { display: flex; flex-direction: column; gap: 12px; }

    .chat-card {
      background: white; border-radius: 18px;
      border: 1.5px solid var(--border-light);
      padding: 18px 20px; display: flex; gap: 16px; align-items: center;
      cursor: pointer; transition: all 0.18s;
      text-decoration: none; color: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .chat-card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(15,157,88,0.1); transform: translateY(-2px); }
    .chat-card.unread { border-left: 4px solid var(--primary); }

    .chat-thumb {
      width: 56px; height: 56px; border-radius: 14px;
      object-fit: cover; flex-shrink: 0;
    }
    .chat-thumb-placeholder {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--bg-mint); display: flex; align-items: center;
      justify-content: center; font-size: 24px; flex-shrink: 0;
    }

    .chat-info { flex: 1; min-width: 0; }
    .chat-title { font-size: 14px; font-weight: 800; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-location { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .chat-last-msg { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-last-msg b { color: var(--text-dark); }

    .chat-right { text-align: right; flex-shrink: 0; }
    .chat-time { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .unread-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--primary); color: white; font-size: 10px; font-weight: 800;
    }
    .chat-participants {
      display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px;
    }
    .chip {
      padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700;
    }
    .chip-buyer    { background: #dbeafe; color: #1e40af; }
    .chip-seller   { background: #dcfce7; color: var(--dark-forest); }
    .chip-provider { background: #fef3c7; color: #92400e; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
    .empty-state p  { font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .browse-btn {
      background: var(--primary); color: white; border: none;
      padding: 12px 24px; border-radius: 16px; font-size: 14px;
      font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block;
    }

    /* ── Loading ── */
    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  </style>
</head>

const ROLE_LABELS = {
  buyer:    { label:'buyer',            dbRole:'buyer',            emoji:'👤', chipClass:'chip-buyer'    },
  seller:   { label:'seller',           dbRole:'seller',           emoji:'🙋', chipClass:'chip-seller'   },
  provider: { label:'service_provider', dbRole:'service_provider', emoji:'🏢', chipClass:'chip-provider' },
};

let allChats = { buyer:[], seller:[], provider:[] };
let activeTab = 'buyer';

/* ── Load all chats from Supabase ──────────────────────────────── */
async function loadAllChats() {
  try {
    const { data, error } = await sb
      .from('transfer_chats')
      .select('id, ad_id, sender_role, message, created_at')
      .not('ad_id', 'is', null)
      .order('created_at', { ascending: false })
      .limit(500);

    if (error) { console.warn('Load error:', error); return; }
    if (!data || data.length === 0) { renderTab(); return; }

    // Group by ad_id, then by sender_role
    const grouped = {};
    data.forEach(m => {
      const adId = m.ad_id;
      const role = m.sender_role === 'service_provider' ? 'provider' : m.sender_role;
      if (!grouped[adId]) grouped[adId] = {};
      if (!grouped[adId][role]) grouped[adId][role] = [];
      grouped[adId][role].push(m);
    });

    // Build chat summaries per role
    allChats = { buyer:[], seller:[] };

    Object.entries(grouped).forEach(([adId, roleMap]) => {
      const listing = LISTINGS[adId] || { title: adId, location: '', img: '', category: '' };
      Object.entries(roleMap).forEach(([role, msgs]) => {
        if (!allChats[role]) return;
        const last = msgs[0]; // already desc order
        const allRoles = [...new Set(data.filter(m => m.ad_id === adId).map(m => m.sender_role))];
        allChats[role].push({ adId, listing, lastMsg: last, msgCount: msgs.length, allRoles });
      });
    });

    // Sort by last message time
    ['buyer','seller'].forEach(r => {
      allChats[r].sort((a,b) => new Date(b.lastMsg.created_at) - new Date(a.lastMsg.created_at));
    });

    // Update counts
    ['buyer','seller'].forEach(r => {
      const el = document.getElementById('count-' + r);
      if (el) el.textContent = allChats[r].length;
    });

    renderTab();
  } catch(e) { console.error(e); renderTab(); }
}

/* ── Render current tab ─────────────────────────────────────────── */
function renderTab() {
  const list = allChats[activeTab] || [];
  const container = document.getElementById('chatList');

  if (list.length === 0) {
    const emptyType = activeTab === 'buyer' ? 'Active Deal Chats' : 'My Resale Listings';
    const roleEmoji = activeTab === 'buyer' ? '💬' : '🤝';
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${roleEmoji}</div>
        <h3>No ${emptyType} yet</h3>
        <p>Open any deal and chat to see conversations here.</p>
        <a href="index.html" class="browse-btn">Browse Available Deals →</a>
      </div>`;
    return;
  }

  container.innerHTML = list.map(chat => {
    const l = chat.listing;
    const roleLabel = chat.lastMsg.sender_role;
    const roleEmoji = { buyer:'👤', seller:'🙋', service_provider:'🏢' }[roleLabel] || '💬';
    const time = new Date(chat.lastMsg.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    const date = new Date(chat.lastMsg.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short' });

    return `
      <a class="chat-card" href="detail.html?id=${chat.adId}">
        ${l.img
          ? `<img class="chat-thumb" src="${l.img}" alt="">`
          : `<div class="chat-thumb-placeholder">🏷️</div>`}
        <div class="chat-info">
          <div class="chat-title">${l.title || chat.adId}</div>
          <div class="chat-location">📍 ${l.location || ''} ${l.category ? '· ' + l.category : ''}</div>
          <div class="chat-last-msg"><b>${roleEmoji}</b> ${chat.lastMsg.message.length > 60 ? chat.lastMsg.message.slice(0,60)+'…' : chat.lastMsg.message}</div>
        </div>
        <div class="chat-right">
          <div class="chat-time">${date}<br>${time}</div>
          ${chat.msgCount > 0 ? `<div class="unread-dot">${chat.msgCount}</div>` : ''}
        </div>
      </a>`;
  }).join('');
}

/* ── Switch tab ─────────────────────────────────────────────────── */
function switchTab(role) {
  activeTab = role;
  document.querySelectorAll('.role-tab').forEach(b => {
    if (b.dataset.role === role) {
      b.classList.add('active');
      b.style.background = '#0F9D58';
      b.style.color = 'white';
    } else {
      b.classList.remove('active');
      b.style.background = 'transparent';
      b.style.color = 'var(--text-muted)';
    }
  });
  renderTab();
}

/* ── Realtime: refresh on new messages ─────────────────────────── */
function subscribeRealtime() {
  sb.channel('my-chats-global')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'transfer_chats' }, () => {
      loadAllChats(); // reload on any new message
    })
    .subscribe();
}

function getSavedUser() {
  try {
    const raw = localStorage.getItem('resalehub_user');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function logoutUser() {
  localStorage.removeItem('resalehub_user');
  window.location.href = 'index.html';
}

          👤 ${nameStr}
        </span>
        <button onclick="logoutUser()" style="background:none; border:none; color:var(--badge-red); font-weight:800; cursor:pointer; font-size:11px; margin-left:4px;">Logout</button>
      </div>`;
  } else {
